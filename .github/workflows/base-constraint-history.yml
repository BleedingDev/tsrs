name: Indexed access identity correction experiment

on:
  push:
    branches: [test/base-constraint-history, test/conditional-root-constraint]

permissions:
  contents: read

concurrency:
  group: base-constraint-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conditional-root:
    name: Conditional-root correction and native conformance
    if: github.repository == 'BleedingDev/tsrs' && github.ref == 'refs/heads/test/conditional-root-constraint'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/TypeScript
          ref: 3e9236361fa97a9e6c685f4833ac457ae2d8c50a
          path: ts-ref
          persist-credentials: false
      - name: Verify actual failing compiler source pin
        run: |
          test "$(git -C ts-ref rev-parse HEAD)" = 3e9236361fa97a9e6c685f4833ac457ae2d8c50a
          git -C ts-ref diff --exit-code HEAD -- tsc packages/typescript
      - name: Apply the scoped conditional-root correction
        run: |
          patch="$GITHUB_WORKSPACE/tools/oracle/base-constraint-history/conditional-root-identity.patch"
          git -C ts-ref apply --check "$patch"
          git -C ts-ref apply "$patch"
          git -C ts-ref diff --check
          mkdir -p target/base-constraint-history
          git -C ts-ref diff > target/base-constraint-history/conditional-compiler.patch
          sha256sum "$patch" > target/base-constraint-history/conditional-patch-sha256.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum
      - name: Cold/depth-nine constraint regression
        env:
          HISTORY_API: pinned
          HISTORY_CASE: conditional-root
        run: node tools/oracle/base-constraint-history/run.mjs
      - name: Existing nineteen histories and limiter controls
        env:
          HISTORY_API: pinned
        run: node tools/oracle/base-constraint-history/run.mjs
      - name: Existing checker and compiler tests
        working-directory: ts-ref/tsc
        run: GOWORK=off go test ./internal/checker ./internal/compiler -count=1
      - name: Full native compiler conformance
        working-directory: ts-ref/tsc
        shell: bash
        run: |
          set -o pipefail
          GOWORK=off go test ./internal/testrunner -run '^TestLocal$' -count=1 -timeout=30m \
            2>&1 | tee "$GITHUB_WORKSPACE/target/base-constraint-history/conditional-conformance.log"
      - name: Retain raw research assertions, including inconclusive shape rejection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conditional-root-research-${{ github.sha }}
          path: target/base-constraint-history/
          if-no-files-found: warn
          retention-days: 14
  history:
    name: Go identity - ${{ matrix.candidate }}
    if: github.repository == 'BleedingDev/tsrs' && github.ref == 'refs/heads/test/base-constraint-history'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: main
            repository: microsoft/TypeScript
            revision: 6bdcb54d23f41bc7098c1f3488ac599c75b852ca
            patch: false
          - candidate: indexed-access-identity
            repository: microsoft/TypeScript
            revision: 6bdcb54d23f41bc7098c1f3488ac599c75b852ca
            patch: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.0'
      # Native pinned/main/draft results are retained in earlier immutable runs.
      # Compare one owning-compiler source correction with the same main revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: ts-ref
          persist-credentials: false
      - name: Verify reference identity and tracked sources
        env:
          EXPECTED: ${{ matrix.revision }}
        run: |
          test "$(git -C ts-ref rev-parse HEAD)" = "$EXPECTED"
          git -C ts-ref diff --exit-code HEAD -- tsc packages/typescript
          mkdir -p target/base-constraint-history
          printf '%s\n' "$EXPECTED" > target/base-constraint-history/reference-sha.txt
          git rev-parse HEAD > target/base-constraint-history/research-sha.txt
      - name: Apply and record experimental owning compiler correction
        if: matrix.patch
        run: |
          git -C ts-ref apply --check "$GITHUB_WORKSPACE/tools/oracle/base-constraint-history/indexed-access-identity.patch"
          git -C ts-ref apply "$GITHUB_WORKSPACE/tools/oracle/base-constraint-history/indexed-access-identity.patch"
          git -C ts-ref diff --check
          git -C ts-ref diff > target/base-constraint-history/compiler.patch
          sha256sum tools/oracle/base-constraint-history/indexed-access-identity.patch > target/base-constraint-history/patch-sha256.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum
      - name: Candidate Go histories and type-derived controls
        id: oracle
        continue-on-error: true
        env:
          HISTORY_API: current
        run: node tools/oracle/base-constraint-history/run.mjs
      - name: Existing native checker and compiler integration tests
        if: ${{ !cancelled() && matrix.patch }}
        id: existing
        continue-on-error: true
        working-directory: ts-ref/tsc
        shell: bash
        run: |
          set -o pipefail
          GOTOOLCHAIN=auto GOWORK=off go test ./internal/checker ./internal/compiler -count=1 2>&1 | tee "$GITHUB_WORKSPACE/target/base-constraint-history/existing-tests.log"
      - name: Full native compiler baseline suite
        if: ${{ !cancelled() }}
        id: conformance
        continue-on-error: true
        working-directory: ts-ref/tsc
        shell: bash
        run: |
          set -o pipefail
          GOTOOLCHAIN=auto GOWORK=off go test ./internal/testrunner -run '^TestLocal$' -count=1 -timeout=30m 2>&1 | tee "$GITHUB_WORKSPACE/target/base-constraint-history/conformance.log"
      - name: Retain candidate native outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: base-constraint-history-${{ matrix.candidate }}-${{ github.sha }}
          path: target/base-constraint-history/
          if-no-files-found: error
          retention-days: 14
      - name: Retain any changed compiler baselines
        if: ${{ always() && steps.conformance.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: changed-baselines-${{ matrix.candidate }}-${{ github.sha }}
          path: ts-ref/tsc/testdata/baselines/local/
          if-no-files-found: warn
          retention-days: 14
      - name: Require all candidate expectations (not release acceptance)
        if: always()
        env:
          GO_RESULT: ${{ steps.oracle.outcome }}
          EXISTING_RESULT: ${{ steps.existing.outcome }}
          CONFORMANCE_RESULT: ${{ steps.conformance.outcome }}
          PATCHED: ${{ matrix.patch }}
        run: |
          test "$GO_RESULT" = success
          test "$CONFORMANCE_RESULT" = success
          if [ "$PATCHED" = true ]; then test "$EXISTING_RESULT" = success; fi
