name: Upstream constraint correction candidates

on:
  push:
    branches: [test/base-constraint-history]

permissions:
  contents: read

concurrency:
  group: base-constraint-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    name: Go history - ${{ matrix.candidate }}
    if: github.repository == 'BleedingDev/tsrs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: main
            repository: microsoft/TypeScript
            revision: 6bdcb54d23f41bc7098c1f3488ac599c75b852ca
          - candidate: order-independence-draft
            repository: jakebailey/TypeScript
            revision: bf061ab866a8b8ecd13238247f2601a052dc6e2a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.0'
      # Pinned baseline results are already retained in run 43651919628.
      # These two fixed candidates reuse its fixture and history intervention unchanged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: ts-ref
          persist-credentials: false
      - name: Verify reference identity and tracked sources
        env:
          EXPECTED: ${{ matrix.revision }}
        run: |
          test "$(git -C ts-ref rev-parse HEAD)" = "$EXPECTED"
          git -C ts-ref diff --exit-code HEAD -- tsc packages/typescript
          mkdir -p target/base-constraint-history
          printf '%s\n' "$EXPECTED" > target/base-constraint-history/reference-sha.txt
          git rev-parse HEAD > target/base-constraint-history/research-sha.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum
      - name: Candidate Go histories and type-derived controls
        id: oracle
        continue-on-error: true
        env:
          HISTORY_API: current
        run: node tools/oracle/base-constraint-history/run.mjs
      - name: Retain candidate native outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: base-constraint-history-${{ matrix.candidate }}-${{ github.sha }}
          path: target/base-constraint-history/
          if-no-files-found: error
          retention-days: 14
      - name: Require all candidate expectations (not release acceptance)
        if: always()
        env:
          GO_RESULT: ${{ steps.oracle.outcome }}
        run: test "$GO_RESULT" = success
