name: Base constraint history research

on:
  push:
    branches: [test/base-constraint-history]

permissions:
  contents: read

concurrency:
  group: base-constraint-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    if: github.repository == 'BleedingDev/tsrs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.0'
      - name: Read pinned TypeScript revision
        id: reference
        run: echo "commit=$(node npm/build.mjs --print-typescript-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/TypeScript
          ref: ${{ steps.reference.outputs.commit }}
          path: ts-ref
          persist-credentials: false
      - name: Verify reference identity and tracked sources
        env:
          EXPECTED: ${{ steps.reference.outputs.commit }}
        run: |
          test "$(git -C ts-ref rev-parse HEAD)" = "$EXPECTED"
          git -C ts-ref diff --exit-code HEAD -- tsc packages/typescript
          mkdir -p target/base-constraint-history
          printf '%s\n' "$EXPECTED" > target/base-constraint-history/reference-sha.txt
          git rev-parse HEAD > target/base-constraint-history/research-sha.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ts-ref/tsc/go.mod
          cache-dependency-path: ts-ref/tsc/go.sum
      - name: Reference Go histories and type-derived controls
        id: oracle
        continue-on-error: true
        run: node tools/oracle/base-constraint-history/run.mjs
      - name: Rust retained checker histories and type-derived controls
        id: rust
        if: ${{ !cancelled() && steps.reference.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p tsrs_compiler --test integration base_constraint_history_test::base_constraint_history_matrix -- --exact --nocapture 2>&1 | tee target/base-constraint-history/rust.log
      - name: Retain both native outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: base-constraint-history-${{ github.sha }}
          path: target/base-constraint-history/
          if-no-files-found: error
          retention-days: 14
      - name: Require both expectations (red is research evidence, not a fix)
        if: always()
        env:
          GO_RESULT: ${{ steps.oracle.outcome }}
          RUST_RESULT: ${{ steps.rust.outcome }}
        run: test "$GO_RESULT" = success && test "$RUST_RESULT" = success
